name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Bloque 1: empaqueta la web y la sube como artefacto.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  # Bloque 2: publica el artefacto. Va en un job aparte (como la plantilla oficial
  # de GitHub) para que el artefacto ya esté disponible cuando se pida; en un solo
  # job, deploy-pages lo buscaba medio segundo después de subirlo y a veces no lo
  # encontraba (DOCA-217, 25-11-2026).
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
