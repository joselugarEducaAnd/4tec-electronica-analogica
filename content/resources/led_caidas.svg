<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title"><title id="title">La resistencia recibe la tensión que no cae en el LED</title><rect width="960" height="470" fill="white"/><g font-family="Arial, sans-serif"><text x="24" y="34" font-size="24" fill="#b93649" text-anchor="start">La resistencia recibe la tensión que no cae en el LED</text><path d="M160,180 L160,202" stroke="#263c4a" stroke-width="3" fill="none" stroke-dasharray=""/><circle cx="160" cy="230" r="28" fill="white" stroke="#263c4a" stroke-width="2"/><text x="160" y="223" font-size="20" fill="#b93649" text-anchor="middle">+</text><text x="160" y="248" font-size="20" fill="#176c9a" text-anchor="middle">−</text><path d="M160,258 L160,280" stroke="#263c4a" stroke-width="3" fill="none" stroke-dasharray=""/><text x="117" y="234" font-size="18" fill="#263c4a" text-anchor="end">5 V</text><path d="M160,180 V110 H420 V130" stroke="#263c4a" stroke-width="3" fill="none"/><path d="M420,130 L420,150" stroke="#263c4a" stroke-width="3" fill="none" stroke-dasharray=""/><rect x="408" y="150" width="24" height="55" rx="0" fill="white" stroke="#263c4a" stroke-width="2"/><path d="M420,205 L420,225" stroke="#263c4a" stroke-width="3" fill="none" stroke-dasharray=""/><text x="443" y="181" font-size="17" fill="#263c4a" text-anchor="start">R = 330 Ω</text><path d="M420,235 L420,260" stroke="#263c4a" stroke-width="3" fill="none" stroke-dasharray=""/><path d="M404,260 L436,260 L420,286 Z" fill="white" stroke="#263c4a" stroke-width="3"/><path d="M402,286 L438,286" stroke="#263c4a" stroke-width="3" fill="none" stroke-dasharray=""/><path d="M420,286 L420,315" stroke="#263c4a" stroke-width="3" fill="none" stroke-dasharray=""/><text x="390" y="262" font-size="15" fill="#263c4a" text-anchor="start">A</text><text x="390" y="295" font-size="15" fill="#263c4a" text-anchor="start">K</text><path d="M441,265 L470,239" stroke="#b93649" stroke-width="3" fill="none" stroke-dasharray=""/><path d="M462,234 L470,239 L462,244" fill="none" stroke="#b93649" stroke-width="3" transform="rotate(-41.877869537884294 470 239)"/><path d="M445,284 L474,258" stroke="#b93649" stroke-width="3" fill="none" stroke-dasharray=""/><path d="M466,253 L474,258 L466,263" fill="none" stroke="#b93649" stroke-width="3" transform="rotate(-41.877869537884294 474 258)"/><path d="M420,225 V235 M420,315 V365 H160 V280" stroke="#263c4a" stroke-width="3" fill="none"/><text x="610" y="160" font-size="22" fill="#263c4a" text-anchor="start">Fuente: entrega 5 V</text><text x="610" y="215" font-size="22" fill="#263c4a" text-anchor="start">Resistencia: caída de 3 V</text><text x="610" y="270" font-size="22" fill="#263c4a" text-anchor="start">LED rojo: caída ≈ 2 V</text><text x="610" y="340" font-size="24" fill="#b93649" text-anchor="start">5 V = 3 V + 2 V</text><circle cx="420" cy="130" r="5" fill="#263c4a"/><text x="430" y="121" font-size="16" fill="#263c4a" text-anchor="start">P1</text><circle cx="420" cy="225" r="5" fill="#263c4a"/><text x="430" y="216" font-size="16" fill="#263c4a" text-anchor="start">P2</text><circle cx="420" cy="365" r="5" fill="#263c4a"/><text x="430" y="356" font-size="16" fill="#263c4a" text-anchor="start">P0</text></g></svg>