<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img"><title>Reconocer el PNP y el indicador sonoro activo</title><rect width="100%" height="100%" fill="white"/><g font-family="Arial" fill="#252535"><text x="25" y="40" font-size="28" fill="#453f93">Dos piezas para la ampliación: qué son y cómo se conectan</text><path d="M95 170Q200 60 305 170V280H95Z" fill="#333"/><text x="140" y="220" fill="white" font-size="25">2N3906</text><path d="M135 280V380 M200 280V380 M265 280V380" stroke="#777" stroke-width="9"/><g font-size="24"><text x="119" y="418">1 E</text><text x="184" y="418">2 B</text><text x="250" y="418">3 C</text><text x="40" y="470">onsemi · TO-92, patas rectas</text><text x="40" y="505">Cara plana hacia ti, patas abajo.</text></g><g fill="none" stroke="#333" stroke-width="4"><path d="M425 250H480 M480 210V290 M480 225L545 170V115 M480 275L545 330V390 M505 220L491 219L498 206"/></g><g font-size="24"><text x="413" y="235">B</text><text x="560" y="155">E: +5 V</text><text x="560" y="355">C: carga</text><text x="402" y="450">PNP: flecha hacia la base.</text><text x="402" y="490">B ≈ E: apagado.</text><text x="402" y="528">B unos 0,7 V por debajo:</text><text x="402" y="562">puede conducir de E a C.</text></g><ellipse cx="990" cy="155" rx="90" ry="30" fill="#444"/><path d="M900 155V310Q990 355 1080 310V155" fill="#292929"/><ellipse cx="990" cy="155" rx="90" ry="30" fill="#444"/><circle cx="990" cy="150" r="15" fill="#111"/><text x="1015" y="225" font-size="32" fill="white">+</text><path d="M945 327V388 M1035 327V410" stroke="#888" stroke-width="7"/><g font-size="22"><text x="908" y="447">Indicador piezoeléctrico</text><text x="911" y="480">CPI-2316-5-85T</text><text x="869" y="516">Oscilador interno: usa continua.</text><text x="866" y="552">Identifica el + marcado;</text><text x="866" y="583">no deduzcas solo por longitud.</text></g><text x="25" y="630" font-size="20">Aspectos ilustrados. Confirma referencia y patillas en la ficha del fabricante antes de un montaje físico.</text></g></svg>