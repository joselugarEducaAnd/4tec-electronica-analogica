<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title"><title id="title">Carga: la tensión aumenta; la corriente disminuye</title><rect width="960" height="470" fill="white"/><g font-family="Arial, sans-serif"><text x="24" y="34" font-size="24" fill="#b93649" text-anchor="start">Carga: la tensión aumenta; la corriente disminuye</text><rect x="25" y="75" width="290" height="290" rx="15" fill="#f8fafb" stroke="#d5e0e4" stroke-width="2"/><text x="45" y="110" font-size="20" fill="#263c4a" text-anchor="start">Principio</text><rect x="110" y="145" width="100" height="145" rx="0" fill="white" stroke="#263c4a" stroke-width="2"/><rect x="110" y="290" width="100" height="0" rx="0" fill="#74bfc6" stroke="#263c4a" stroke-width="2"/><text x="160" y="330" font-size="23" fill="#263c4a" text-anchor="middle">0,00 V</text><text x="35" y="405" font-size="17" fill="#263c4a" text-anchor="start">I máxima; VC = 0 V</text><rect x="335" y="75" width="290" height="290" rx="15" fill="#f8fafb" stroke="#d5e0e4" stroke-width="2"/><text x="355" y="110" font-size="20" fill="#263c4a" text-anchor="start">A un tiempo τ</text><rect x="420" y="145" width="100" height="145" rx="0" fill="white" stroke="#263c4a" stroke-width="2"/><rect x="420" y="201.51999999999998" width="100" height="88.48" rx="0" fill="#74bfc6" stroke="#263c4a" stroke-width="2"/><text x="470" y="330" font-size="23" fill="#263c4a" text-anchor="middle">3,16 V</text><text x="345" y="405" font-size="17" fill="#263c4a" text-anchor="start">VC ≈ 63 % de 5 V</text><rect x="645" y="75" width="290" height="290" rx="15" fill="#f8fafb" stroke="#d5e0e4" stroke-width="2"/><text x="665" y="110" font-size="20" fill="#263c4a" text-anchor="start">Casi al final (5τ)</text><rect x="730" y="145" width="100" height="145" rx="0" fill="white" stroke="#263c4a" stroke-width="2"/><rect x="730" y="150.84" width="100" height="139.16" rx="0" fill="#74bfc6" stroke="#263c4a" stroke-width="2"/><text x="780" y="330" font-size="23" fill="#263c4a" text-anchor="middle">4,97 V</text><text x="655" y="405" font-size="17" fill="#263c4a" text-anchor="start">I casi nula; VC ≈ 5 V</text></g></svg>