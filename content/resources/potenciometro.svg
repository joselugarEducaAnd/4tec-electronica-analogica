<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title"><title id="title">El cursor selecciona una parte de la pista resistiva</title><rect width="960" height="470" fill="white"/><g font-family="Arial, sans-serif"><text x="24" y="34" font-size="24" fill="#b93649" text-anchor="start">El cursor selecciona una parte de la pista resistiva</text><rect x="60" y="80" width="180" height="100" rx="15" fill="#346d9a" stroke="#263c4a" stroke-width="2"/><circle cx="150" cy="110" r="25" fill="#ccc" stroke="#263c4a" stroke-width="2"/><path d="M95,180 L95,245" stroke="#263c4a" stroke-width="3" fill="none" stroke-dasharray=""/><path d="M150,180 L150,245" stroke="#263c4a" stroke-width="3" fill="none" stroke-dasharray=""/><path d="M205,180 L205,245" stroke="#263c4a" stroke-width="3" fill="none" stroke-dasharray=""/><text x="90" y="279" font-size="20" fill="#263c4a" text-anchor="start">1</text><text x="144" y="279" font-size="20" fill="#263c4a" text-anchor="start">2</text><text x="200" y="279" font-size="20" fill="#263c4a" text-anchor="start">3</text><text x="50" y="330" font-size="20" fill="#263c4a" text-anchor="start">2 = cursor móvil</text><text x="50" y="375" font-size="18" fill="#263c4a" text-anchor="start">1–3: resistencia total constante.</text><path d="M390,130 L470,130" stroke="#263c4a" stroke-width="3" fill="none" stroke-dasharray=""/><rect x="470" y="118" width="190" height="24" rx="0" fill="white" stroke="#263c4a" stroke-width="2"/><path d="M660,130 L745,130" stroke="#263c4a" stroke-width="3" fill="none" stroke-dasharray=""/><path d="M565,235 L565,145" stroke="#b93649" stroke-width="3" fill="none" stroke-dasharray=""/><path d="M557,140 L565,145 L557,150" fill="none" stroke="#b93649" stroke-width="3" transform="rotate(-90.0 565 145)"/><text x="380" y="105" font-size="19" fill="#263c4a" text-anchor="start">1</text><text x="745" y="105" font-size="19" fill="#263c4a" text-anchor="start">3</text><text x="585" y="220" font-size="19" fill="#263c4a" text-anchor="start">2 · cursor</text><path d="M565,235 V280 H745 V130" stroke="#b93649" stroke-width="3" fill="none"/><text x="420" y="345" font-size="20" fill="#263c4a" text-anchor="start">Une 2 y 3. Usa 1 y el conjunto 2–3.</text><text x="420" y="390" font-size="17" fill="#263c4a" text-anchor="start">Girar cambia la resistencia entre esos extremos.</text></g></svg>