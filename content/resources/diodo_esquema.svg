<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 465" role="img" aria-labelledby="titulo-rect"><title id="titulo-rect">El diodo con corriente alterna: un solo circuito</title><rect width="960" height="465" fill="white"/><g font-family="Verdana, 'DejaVu Sans', Arial, sans-serif"><text x="24" y="34" font-size="24" fill="#b93649" text-anchor="start">Un diodo con corriente alterna</text><circle cx="140" cy="210" r="34" fill="white" stroke="#263c4a" stroke-width="2"/><text x="140" y="221" font-size="38" fill="#263c4a" text-anchor="middle">~</text><text x="98" y="218" font-size="22" fill="#263c4a" text-anchor="end">Entrada</text><path d="M140,176 V105 H370 V140" stroke="#263c4a" stroke-width="3" fill="none"/><path d="M370,140 L370,165" stroke="#263c4a" stroke-width="3" fill="none" stroke-dasharray=""/><path d="M354,165 L386,165 L370,191 Z" fill="white" stroke="#263c4a" stroke-width="3"/><path d="M352,191 L388,191" stroke="#263c4a" stroke-width="3" fill="none" stroke-dasharray=""/><path d="M370,191 L370,220" stroke="#263c4a" stroke-width="3" fill="none" stroke-dasharray=""/><text x="340" y="167" font-size="15" fill="#263c4a" text-anchor="start">A</text><text x="340" y="200" font-size="15" fill="#263c4a" text-anchor="start">K</text><path d="M370,220 V240" stroke="#263c4a" stroke-width="3" fill="none"/><path d="M370,240 L370,260" stroke="#263c4a" stroke-width="3" fill="none" stroke-dasharray=""/><rect x="358" y="260" width="24" height="55" rx="0" fill="white" stroke="#263c4a" stroke-width="2"/><path d="M370,315 L370,335" stroke="#263c4a" stroke-width="3" fill="none" stroke-dasharray=""/><text x="393" y="291" font-size="17" fill="#263c4a" text-anchor="start">1 kΩ</text><path d="M370,335 V380 H140 V244" stroke="#263c4a" stroke-width="3" fill="none"/><circle cx="370" cy="240" r="5" fill="#263c4a"/><text x="380" y="231" font-size="16" fill="#263c4a" text-anchor="start">S</text><circle cx="370" cy="360" r="5" fill="#263c4a"/><text x="380" y="351" font-size="16" fill="#263c4a" text-anchor="start">0 V</text><path d="M370,240 H555 V278" stroke="#b93649" stroke-width="3" fill="none"/><circle cx="555" cy="300" r="22" fill="white" stroke="#263c4a" stroke-width="2"/><text x="555" y="306" font-size="18" fill="#263c4a" text-anchor="middle">V</text><path d="M555,322 V360 H370" stroke="#1f1f1f" stroke-width="3" fill="none"/><text x="594" y="305" font-size="18" fill="#263c4a" text-anchor="start">Salida: roja en S, negra en 0 V</text><path d="M215,105 L285,105" stroke="#16725e" stroke-width="3" fill="none" stroke-dasharray=""/><path d="M277,100 L285,105 L277,110" fill="none" stroke="#16725e" stroke-width="3" transform="rotate(0.0 285 105)"/><text x="210" y="83" font-size="17" fill="#16725e" text-anchor="start">Solo pasa corriente con la entrada positiva</text><text x="40" y="425" font-size="18" fill="#263c4a" text-anchor="start">Entrada: el + y el − se intercambian. Salida: tensión entre S y 0 V, en la resistencia.</text></g><text x="563" y="345" font-size="16" fill="#1f1f1f" text-anchor="start" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif">negra</text><text x="563" y="364" font-size="16" fill="#1f1f1f" text-anchor="start" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif">(COM)</text></svg>