<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title"><title id="title">Tres patillas con funciones diferentes</title><rect width="960" height="440" fill="white"/><g font-family="Arial, sans-serif"><text x="24" y="34" font-size="24" fill="#b93649" text-anchor="start">Tres patillas con funciones diferentes</text><rect x="85" y="100" width="150" height="95" rx="25" fill="#293843" stroke="#263c4a" stroke-width="2"/><text x="160" y="151" font-size="23" fill="white" text-anchor="middle">2N3904</text><path d="M110,195 L110,295" stroke="#8b969d" stroke-width="6" fill="none" stroke-dasharray=""/><text x="110" y="330" font-size="17" fill="#263c4a" text-anchor="middle">1 · E</text><path d="M160,195 L160,295" stroke="#8b969d" stroke-width="6" fill="none" stroke-dasharray=""/><text x="160" y="330" font-size="17" fill="#263c4a" text-anchor="middle">2 · B</text><path d="M210,195 L210,295" stroke="#8b969d" stroke-width="6" fill="none" stroke-dasharray=""/><text x="210" y="330" font-size="17" fill="#263c4a" text-anchor="middle">3 · C</text><text x="55" y="385" font-size="19" fill="#263c4a" text-anchor="start">Cara plana hacia ti; patillas hacia abajo.</text><text x="450" y="110" font-size="22" fill="#263c4a" text-anchor="start">Modelo: onsemi 2N3904, TO-92</text><text x="450" y="165" font-size="19" fill="#263c4a" text-anchor="start">E · emisor: retorno de la corriente.</text><text x="450" y="215" font-size="19" fill="#263c4a" text-anchor="start">B · base: controla con una corriente pequeña.</text><text x="450" y="265" font-size="19" fill="#263c4a" text-anchor="start">C · colector: rama de la carga.</text><text x="450" y="340" font-size="19" fill="#b93649" text-anchor="start">No traslades este orden a otro modelo.</text></g></svg>