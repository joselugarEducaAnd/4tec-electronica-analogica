asharray=""/><path d="M477,270 L484,249" stroke="#263c4a" stroke-width="3" fill="none" stroke-dasharray=""/><text x="510" y="100" font-size="18" fill="#263c4a" text-anchor="start">1 · Pantalla: número y unidad.</text><text x="510" y="160" font-size="18" fill="#263c4a" text-anchor="start">2 · Selector: magnitud y rango.</text><text x="510" y="220" font-size="18" fill="#263c4a" text-anchor="start">3 · COM: punta negra.</text><text x="510" y="280" font-size="18" fill="#263c4a" text-anchor="start">4 · V/Ω: roja para tensión y resistencia.</text><text x="510" y="340" font-size="18" fill="#263c4a" text-anchor="start">5 · A/mA: roja solo para corriente.</text><text x="510" y="400" font-size="18" fill="#263c4a" text-anchor="start">6 · Puntas: contacto con los nodos.</text><circle cx="108" cy="106" r="11" fill="white" stroke="#b93649" stroke-width="2"/><text x="108" y="111" font-size="15" fill="#b93649" text-anchor="middle">1</text><circle cx="187" cy="230" r="11" fill="white" stroke="#b93649" stroke-width="2"/><text x="187" y="235" font-size="15" fill="#b93649" text-anchor="middle">2</text><circle cx="195" cy="345" r="11" fill="white" stroke="#b93649" stroke-width="2"/><text x="195" y="350" font-size="15" fill="#b93649" text-anchor="middle">3</text><circle cx="270" cy="345" r="11" fill="white" stroke="#b93649" stroke-width="2"/><text x="270" y="350" font-size="15" fill="#b93649" text-anchor="middle">4</text><circle cx="115" cy="345" r="11" fill="white" stroke="#b93649" stroke-width="2"/><text x="115" y="350" font-size="15" fill="#b93649" text-anchor="middle">5</text><circle cx="445" cy="290" r="11" fill="white" stroke="#b93649" stroke-width="2"/><text x="445" y="295" font-size="15" fill="#b93649" text-anchor="middle">6</text></g></svg>