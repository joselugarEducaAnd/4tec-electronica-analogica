<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title"><title id="title">Ejemplo resuelto: localizar la salida antes de calcular</title><rect width="960" height="470" fill="white"/><g font-family="Arial, sans-serif"><text x="24" y="34" font-size="24" fill="#b93649" text-anchor="start">Ejemplo resuelto: localizar la salida antes de calcular</text><path d="M170,170 L170,192" stroke="#263c4a" stroke-width="3" fill="none" stroke-dasharray=""/><circle cx="170" cy="220" r="28" fill="white" stroke="#263c4a" stroke-width="2"/><text x="170" y="213" font-size="20" fill="#b93649" text-anchor="middle">+</text><text x="170" y="238" font-size="20" fill="#176c9a" text-anchor="middle">−</text><path d="M170,248 L170,270" stroke="#263c4a" stroke-width="3" fill="none" stroke-dasharray=""/><text x="127" y="224" font-size="18" fill="#263c4a" text-anchor="end">6 V</text><path d="M170,170 V115 H390 V130" stroke="#263c4a" stroke-width="3" fill="none"/><path d="M390,130 L390,150" stroke="#263c4a" stroke-width="3" fill="none" stroke-dasharray=""/><rect x="378" y="150" width="24" height="55" rx="0" fill="white" stroke="#263c4a" stroke-width="2"/><path d="M390,205 L390,225" stroke="#263c4a" stroke-width="3" fill="none" stroke-dasharray=""/><text x="413" y="181" font-size="17" fill="#263c4a" text-anchor="start">R₁ = 2 kΩ</text><path d="M390,225 L390,245" stroke="#263c4a" stroke-width="3" fill="none" stroke-dasharray=""/><rect x="378" y="245" width="24" height="55" rx="0" fill="white" stroke="#263c4a" stroke-width="2"/><path d="M390,300 L390,320" stroke="#263c4a" stroke-width="3" fill="none" stroke-dasharray=""/><text x="413" y="276" font-size="17" fill="#263c4a" text-anchor="start">R₂ = 1 kΩ</text><path d="M390,320 V360 H170 V270" stroke="#263c4a" stroke-width="3" fill="none"/><circle cx="390" cy="225" r="5" fill="#263c4a"/><text x="400" y="216" font-size="16" fill="#263c4a" text-anchor="start">S</text><circle cx="390" cy="360" r="5" fill="#263c4a"/><text x="400" y="351" font-size="16" fill="#263c4a" text-anchor="start">0 V</text><path d="M390,225 H600 V263" stroke="#b93649" stroke-width="3" fill="none"/><circle cx="600" cy="285" r="22" fill="white" stroke="#263c4a" stroke-width="2"/><text x="600" y="291" font-size="18" fill="#263c4a" text-anchor="middle">V</text><path d="M600,307 V360 H390" stroke="#176c9a" stroke-width="3" fill="none"/><text x="655" y="292" font-size="26" fill="#263c4a" text-anchor="start">2,00 V</text><text x="100" y="425" font-size="20" fill="#263c4a" text-anchor="start">I = 2 mA. R₁ recibe 4 V; R₂ recibe 2 V. La suma es 6 V.</text></g></svg>