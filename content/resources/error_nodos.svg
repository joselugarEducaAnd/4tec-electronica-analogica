<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title"><title id="title">Un componente necesita dos nodos distintos</title><rect width="960" height="470" fill="white"/><g font-family="Arial, sans-serif"><text x="24" y="34" font-size="24" fill="#b93649" text-anchor="start">Un componente necesita dos nodos distintos</text><rect x="15" y="60" width="440" height="350" rx="14" fill="#f8fafb" stroke="#d5e0e4" stroke-width="2"/><text x="35" y="90" font-size="21" fill="#263c4a" text-anchor="start">Correcto: resistencia entre dos nodos</text><path d="M200,150 L200,170" stroke="#263c4a" stroke-width="3" fill="none" stroke-dasharray=""/><rect x="188" y="170" width="24" height="55" rx="0" fill="white" stroke="#263c4a" stroke-width="2"/><path d="M200,225 L200,245" stroke="#263c4a" stroke-width="3" fill="none" stroke-dasharray=""/><text x="223" y="201" font-size="17" fill="#263c4a" text-anchor="start">R</text><circle cx="200" cy="150" r="5" fill="#263c4a"/><text x="210" y="141" font-size="16" fill="#263c4a" text-anchor="start">a5</text><circle cx="200" cy="245" r="5" fill="#263c4a"/><text x="210" y="236" font-size="16" fill="#263c4a" text-anchor="start">a10</text><text x="50" y="330" font-size="18" fill="#263c4a" text-anchor="start">Filas 5 y 10: no unidas internamente.</text><rect x="505" y="60" width="440" height="350" rx="14" fill="#f8fafb" stroke="#d5e0e4" stroke-width="2"/><text x="525" y="90" font-size="21" fill="#263c4a" text-anchor="start">Incorrecto: dos patas en el mismo nodo</text><path d="M700,150 L700,170" stroke="#263c4a" stroke-width="3" fill="none" stroke-dasharray=""/><rect x="688" y="170" width="24" height="55" rx="0" fill="white" stroke="#263c4a" stroke-width="2"/><path d="M700,225 L700,245" stroke="#263c4a" stroke-width="3" fill="none" stroke-dasharray=""/><text x="723" y="201" font-size="17" fill="#263c4a" text-anchor="start">R</text><circle cx="700" cy="150" r="5" fill="#263c4a"/><text x="710" y="141" font-size="16" fill="#263c4a" text-anchor="start">a5</text><circle cx="700" cy="245" r="5" fill="#263c4a"/><text x="710" y="236" font-size="16" fill="#263c4a" text-anchor="start">e5</text><path d="M700,150 H630 V245 H700" stroke="#b93649" stroke-width="3" fill="none"/><text x="535" y="330" font-size="16" fill="#263c4a" text-anchor="start">a5–e5 ya están unidos: R queda puenteada.</text><text x="535" y="370" font-size="18" fill="#263c4a" text-anchor="start">Mueve una pata a otra fila.</text></g></svg>