<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title"><title id="title">La conexión determina cómo se reparten V e I</title><rect width="960" height="470" fill="white"/><g font-family="Arial, sans-serif"><text x="24" y="34" font-size="24" fill="#b93649" text-anchor="start">La conexión determina cómo se reparten V e I</text><rect x="15" y="60" width="440" height="350" rx="14" fill="#f8fafb" stroke="#d5e0e4" stroke-width="2"/><text x="35" y="90" font-size="21" fill="#263c4a" text-anchor="start">Serie · un único recorrido</text><path d="M95,180 L95,202" stroke="#263c4a" stroke-width="3" fill="none" stroke-dasharray=""/><circle cx="95" cy="230" r="28" fill="white" stroke="#263c4a" stroke-width="2"/><text x="95" y="223" font-size="20" fill="#b93649" text-anchor="middle">+</text><text x="95" y="248" font-size="20" fill="#176c9a" text-anchor="middle">−</text><path d="M95,258 L95,280" stroke="#263c4a" stroke-width="3" fill="none" stroke-dasharray=""/><text x="52" y="234" font-size="18" fill="#263c4a" text-anchor="end">5 V</text><path d="M95,180 V125 H300 V140" stroke="#263c4a" stroke-width="3" fill="none"/><path d="M300,140 L300,160" stroke="#263c4a" stroke-width="3" fill="none" stroke-dasharray=""/><rect x="288" y="160" width="24" height="55" rx="0" fill="white" stroke="#263c4a" stroke-width="2"/><path d="M300,215 L300,235" stroke="#263c4a" stroke-width="3" fill="none" stroke-dasharray=""/><text x="323" y="191" font-size="17" fill="#263c4a" text-anchor="start">R₁ = 1 kΩ</text><path d="M300,235 L300,255" stroke="#263c4a" stroke-width="3" fill="none" stroke-dasharray=""/><rect x="288" y="255" width="24" height="55" rx="0" fill="white" stroke="#263c4a" stroke-width="2"/><path d="M300,310 L300,330" stroke="#263c4a" stroke-width="3" fill="none" stroke-dasharray=""/><text x="323" y="286" font-size="17" fill="#263c4a" text-anchor="start">R₂ = 1 kΩ</text><path d="M300,330 V360 H95 V280" stroke="#263c4a" stroke-width="3" fill="none"/><circle cx="300" cy="235" r="5" fill="#263c4a"/><text x="310" y="226" font-size="16" fill="#263c4a" text-anchor="start">S</text><text x="40" y="398" font-size="17" fill="#263c4a" text-anchor="start">I = 2,5 mA; V₁ = V₂ = 2,5 V</text><rect x="505" y="60" width="440" height="350" rx="14" fill="#f8fafb" stroke="#d5e0e4" stroke-width="2"/><text x="525" y="90" font-size="21" fill="#263c4a" text-anchor="start">Paralelo · dos recorridos</text><path d="M585,175 L585,197" stroke="#263c4a" stroke-width="3" fill="none" stroke-dasharray=""/><circle cx="585" cy="225" r="28" fill="white" stroke="#263c4a" stroke-width="2"/><text x="585" y="218" font-size="20" fill="#b93649" text-anchor="middle">+</text><text x="585" y="243" font-size="20" fill="#176c9a" text-anchor="middle">−</text><path d="M585,253 L585,275" stroke="#263c4a" stroke-width="3" fill="none" stroke-dasharray=""/><text x="542" y="229" font-size="18" fill="#263c4a" text-anchor="end">5 V</text><path d="M585,175 V130 H835 V175" stroke="#263c4a" stroke-width="3" fill="none"/><path d="M710,175 L710,195" stroke="#263c4a" stroke-width="3" fill="none" stroke-dasharray=""/><rect x="698" y="195" width="24" height="55" rx="0" fill="white" stroke="#263c4a" stroke-width="2"/><path d="M710,250 L710,270" stroke="#263c4a" stroke-width="3" fill="none" stroke-dasharray=""/><text x="733" y="226" font-size="17" fill="#263c4a" text-anchor="start">R₁</text><path d="M835,175 L835,195" stroke="#263c4a" stroke-width="3" fill="none" stroke-dasharray=""/><rect x="823" y="195" width="24" height="55" rx="0" fill="white" stroke="#263c4a" stroke-width="2"/><path d="M835,250 L835,270" stroke="#263c4a" stroke-width="3" fill="none" stroke-dasharray=""/><text x="858" y="226" font-size="17" fill="#263c4a" text-anchor="start">R₂</text><path d="M710,175 V130 M710,270 V330 H585 V275 M835,270 V330 H710" stroke="#263c4a" stroke-width="3" fill="none"/><circle cx="710" cy="130" r="5" fill="#263c4a"/><text x="720" y="121" font-size="16" fill="#263c4a" text-anchor="start">P</text><circle cx="710" cy="330" r="5" fill="#263c4a"/><text x="720" y="321" font-size="16" fill="#263c4a" text-anchor="start">0 V</text><text x="535" y="370" font-size="17" fill="#263c4a" text-anchor="start">R₁ = R₂ = 1 kΩ; cada rama: 5 mA.</text><text x="535" y="398" font-size="16" fill="#263c4a" text-anchor="start">Cada R recibe 5 V; la fuente entrega 10 mA.</text></g></svg>