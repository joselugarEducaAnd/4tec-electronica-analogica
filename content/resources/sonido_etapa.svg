<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" role="img"><title>Ampliación sonora: NPN gobierna PNP y zumbador activo</title><rect width="100%" height="100%" fill="white"/><g font-family="Arial" fill="#252535"><text x="25" y="35" font-size="28" fill="#453f93">Una etapa de mando y otra para la carga sonora</text><text x="25" y="72" font-size="20" fill="#252535">Fuente común de 5 V · sustituye la rama LED por esta ampliación guiada</text><path d="M80 365V130H1050 M80 455V700H1050" fill="none" stroke="#333" stroke-width="3"/><circle cx="80" cy="410" r="45" fill="white" stroke="#333" stroke-width="3"/><text x="72" y="395" font-size="20" fill="#252535">+</text><text x="73" y="435" font-size="20" fill="#252535">−</text><text x="23" y="500" font-size="20" fill="#252535">5 V</text><text x="1060" y="138" font-size="20" fill="#252535">+5 V</text><text x="1060" y="707" font-size="20" fill="#252535">0 V</text><path d="M300 130V200 M300 270V410 M300 465V520 M300 580V700" fill="none" stroke="#333" stroke-width="3"/><rect x="284" y="200" width="32" height="70" fill="white" stroke="#333" stroke-width="3"/><path d="M274 280L325 190H338" fill="none" stroke="#333" stroke-width="3"/><text x="330" y="219" font-size="20" fill="#252535">NTC 10 kΩ</text><text x="330" y="245" font-size="20" fill="#252535">nominal a 25 °C</text><text x="260" y="330" font-size="20" fill="#252535">S</text><circle cx="300" cy="340" r="5"/><rect x="284" y="410" width="32" height="55" fill="white" stroke="#333" stroke-width="3"/><text x="326" y="444" font-size="20" fill="#252535">1 kΩ fija</text><rect x="284" y="520" width="32" height="60" fill="white" stroke="#333" stroke-width="3"/><path d="M245 550H300 M292 544L300 550L292 556 M245 550V600H300" fill="none" stroke="#333" stroke-width="3"/><text x="327" y="540" font-size="20" fill="#252535">Ajuste 10 kΩ</text><text x="327" y="568" font-size="20" fill="#252535">a 500 Ω</text><text x="327" y="597" font-size="20" fill="#252535">en el ensayo</text><path d="M300 340H400 M460 340H580" fill="none" stroke="#333" stroke-width="3"/><rect x="400" y="325" width="60" height="30" fill="white" stroke="#333" stroke-width="3"/><text x="398" y="310" font-size="20" fill="#252535">1 kΩ</text><text x="390" y="380" font-size="20" fill="#252535">RB1</text><path d="M500 340V430 M500 485V700" fill="none" stroke="#333" stroke-width="3"/><rect x="485" y="430" width="30" height="55" fill="white" stroke="#333" stroke-width="3"/><text x="521" y="477" font-size="20" fill="#252535">100 kΩ</text><circle cx="500" cy="340" r="5"/><path d="M580 318V373 M580 330L620 300V250 M580 357L620 390V700" fill="none" stroke="#333" stroke-width="3"/><path d="M603 388L619 389L614 374" fill="none" stroke="#333" stroke-width="3"/><text x="530" y="310" font-size="20" fill="#252535">B</text><text x="627" y="296" font-size="20" fill="#252535">C</text><text x="628" y="398" font-size="20" fill="#252535">E</text><text x="660" y="640" font-size="20" fill="#252535">Q1 · NPN</text><text x="660" y="670" font-size="20" fill="#252535">2N3904</text><path d="M620 250H650V235H680 M740 235H880" fill="none" stroke="#333" stroke-width="3"/><rect x="680" y="220" width="60" height="30" fill="white" stroke="#333" stroke-width="3"/><text x="680" y="200" font-size="20" fill="#252535">2,2 kΩ</text><path d="M800 130V160 M800 205V235" fill="none" stroke="#333" stroke-width="3"/><rect x="785" y="160" width="30" height="45" fill="white" stroke="#333" stroke-width="3"/><text x="710" y="115" font-size="20" fill="#252535">100 kΩ</text><circle cx="800" cy="235" r="5"/><circle cx="800" cy="130" r="5"/><path d="M880 205V266 M880 220L950 180V130 M880 251L950 290V402" fill="none" stroke="#333" stroke-width="3"/><path d="M907 213L892 213L899 200" fill="none" stroke="#333" stroke-width="3"/><text x="849" y="281" font-size="20" fill="#252535">B</text><text x="962" y="184" font-size="20" fill="#252535">E</text><text x="962" y="296" font-size="20" fill="#252535">C</text><text x="990" y="218" font-size="20" fill="#252535">Q2 · PNP</text><text x="990" y="248" font-size="20" fill="#252535">2N3906</text><circle cx="950" cy="447" r="45" fill="white" stroke="#333" stroke-width="3"/><path d="M950 492V700 M988 427Q1015 447 988 467 M1001 418Q1040 447 1001 476" fill="none" stroke="#333" stroke-width="3"/><text x="940" y="388" font-size="20" fill="#252535">+</text><text x="940" y="520" font-size="20" fill="#252535">−</text><text x="745" y="552" font-size="20" fill="#252535">Zumbador activo</text><text x="745" y="580" font-size="20" fill="#252535">CPI-2316-5-85T</text><text x="745" y="608" font-size="20" fill="#252535">5 V · hasta 15 mA</text><text x="35" y="755" font-size="22" fill="#252535">Frío del modelo (20 kΩ): Q1 casi no conduce → Q2 queda apagado → salida ≈ 0 V.</text><text x="35" y="793" font-size="22" fill="#252535">Caliente del modelo (5 kΩ): Q1 baja su colector → Q2 conduce → salida ≈ 4,94 V.</text><text x="35" y="836" font-size="21" fill="#453f93">Ensayo eléctrico: 330 Ω en lugar del zumbador. No demuestra sonido ni temperaturas reales.</text></g></svg>