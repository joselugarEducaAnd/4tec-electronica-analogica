<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="title"><title id="title">Leer una resistencia: color Y posición</title><rect width="960" height="490" fill="white"/><g font-family="Arial, sans-serif"><text x="24" y="34" font-size="24" fill="#b93649" text-anchor="start">Leer una resistencia: color Y posición</text><rect x="40" y="60" width="42" height="25" rx="0" fill="#222" stroke="#263c4a" stroke-width="2"/><text x="100" y="80" font-size="18" fill="#263c4a" text-anchor="start">Negro</text><text x="250" y="80" font-size="18" fill="#263c4a" text-anchor="start">0</text><text x="330" y="80" font-size="18" fill="#263c4a" text-anchor="start">×1</text><rect x="40" y="95" width="42" height="25" rx="0" fill="#85502b" stroke="#263c4a" stroke-width="2"/><text x="100" y="115" font-size="18" fill="#263c4a" text-anchor="start">Marrón</text><text x="250" y="115" font-size="18" fill="#263c4a" text-anchor="start">1</text><text x="330" y="115" font-size="18" fill="#263c4a" text-anchor="start">×10</text><rect x="40" y="130" width="42" height="25" rx="0" fill="#d73342" stroke="#263c4a" stroke-width="2"/><text x="100" y="150" font-size="18" fill="#263c4a" text-anchor="start">Rojo</text><text x="250" y="150" font-size="18" fill="#263c4a" text-anchor="start">2</text><text x="330" y="150" font-size="18" fill="#263c4a" text-anchor="start">×100</text><rect x="40" y="165" width="42" height="25" rx="0" fill="#f78b2d" stroke="#263c4a" stroke-width="2"/><text x="100" y="185" font-size="18" fill="#263c4a" text-anchor="start">Naranja</text><text x="250" y="185" font-size="18" fill="#263c4a" text-anchor="start">3</text><text x="330" y="185" font-size="18" fill="#263c4a" text-anchor="start">×1000</text><rect x="40" y="200" width="42" height="25" rx="0" fill="#f6d535" stroke="#263c4a" stroke-width="2"/><text x="100" y="220" font-size="18" fill="#263c4a" text-anchor="start">Amarillo</text><text x="250" y="220" font-size="18" fill="#263c4a" text-anchor="start">4</text><text x="330" y="220" font-size="18" fill="#263c4a" text-anchor="start">×10 000</text><rect x="40" y="235" width="42" height="25" rx="0" fill="#379c61" stroke="#263c4a" stroke-width="2"/><text x="100" y="255" font-size="18" fill="#263c4a" text-anchor="start">Verde</text><text x="250" y="255" font-size="18" fill="#263c4a" text-anchor="start">5</text><text x="330" y="255" font-size="18" fill="#263c4a" text-anchor="start">×100 000</text><rect x="40" y="270" width="42" height="25" rx="0" fill="#2469c9" stroke="#263c4a" stroke-width="2"/><text x="100" y="290" font-size="18" fill="#263c4a" text-anchor="start">Azul</text><text x="250" y="290" font-size="18" fill="#263c4a" text-anchor="start">6</text><text x="330" y="290" font-size="18" fill="#263c4a" text-anchor="start">×1 000 000</text><rect x="40" y="305" width="42" height="25" rx="0" fill="#9b57b6" stroke="#263c4a" stroke-width="2"/><text x="100" y="325" font-size="18" fill="#263c4a" text-anchor="start">Violeta</text><text x="250" y="325" font-size="18" fill="#263c4a" text-anchor="start">7</text><text x="330" y="325" font-size="18" fill="#263c4a" text-anchor="start">×10 000 000</text><rect x="40" y="340" width="42" height="25" rx="0" fill="#858b91" stroke="#263c4a" stroke-width="2"/><text x="100" y="360" font-size="18" fill="#263c4a" text-anchor="start">Gris</text><text x="250" y="360" font-size="18" fill="#263c4a" text-anchor="start">8</text><text x="330" y="360" font-size="18" fill="#263c4a" text-anchor="start">×100 000 000</text><rect x="40" y="375" width="42" height="25" rx="0" fill="#fff" stroke="#263c4a" stroke-width="2"/><text x="100" y="395" font-size="18" fill="#263c4a" text-anchor="start">Blanco</text><text x="250" y="395" font-size="18" fill="#263c4a" text-anchor="start">9</text><text x="330" y="395" font-size="18" fill="#263c4a" text-anchor="start">×1 000 000 000</text><text x="580" y="90" font-size="18" fill="#263c4a" text-anchor="start">4 bandas: dos cifras × multiplicador</text><path d="M575,180 L925,180" stroke="#263c4a" stroke-width="6" fill="none" stroke-dasharray=""/><rect x="635" y="150" width="220" height="60" rx="22" fill="#dfc698" stroke="#263c4a" stroke-width="2"/><rect x="660" y="151" width="12" height="58" rx="0" fill="#85502b" stroke="#85502b" stroke-width="2"/><rect x="705" y="151" width="12" height="58" rx="0" fill="#222" stroke="#222" stroke-width="2"/><rect x="750" y="151" width="12" height="58" rx="0" fill="#d73342" stroke="#d73342" stroke-width="2"/><rect x="820" y="151" width="12" height="58" rx="0" fill="#bd932f" stroke="#bd932f" stroke-width="2"/><text x="580" y="255" font-size="21" fill="#263c4a" text-anchor="start">Marrón · negro · rojo · oro</text><text x="580" y="300" font-size="20" fill="#263c4a" text-anchor="start">10 × 100 = 1000 Ω = 1 kΩ</text><text x="580" y="345" font-size="18" fill="#263c4a" text-anchor="start">Oro: ±5 % → 950 a 1050 Ω</text><text x="580" y="390" font-size="16" fill="#263c4a" text-anchor="start">Plata: ×0,01 o ±10 %; oro: ×0,1.</text><text x="580" y="425" font-size="16" fill="#263c4a" text-anchor="start">El significado depende de la posición.</text></g></svg>