<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>¿Cómo reparte tensión un divisor?</title><style>*{box-sizing:border-box}body{margin:0;padding:18px;background:#f8eff0;color:#203944;font:16px/1.45 Verdana,"DejaVu Sans",Arial,sans-serif}h1{font-size:23px;margin:0 0 8px;color:#943d48}p{margin:8px 0}label{display:block;margin:12px 0 3px;font-weight:600}input,select,button{font:inherit}input[type=range]{width:100%;accent-color:#943d48}button{background:#943d48;color:white;border:0;border-radius:7px;padding:9px 13px;margin:7px 5px 5px 0;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #cc741b;outline-offset:3px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.box{background:white;border:1px solid #e4c8cc;border-radius:10px;padding:12px}output{display:block;font-size:20px;min-height:64px;color:#943d48}.small{font-size:13px}svg{max-width:100%;height:auto}canvas{width:100%;height:200px;background:white;border-radius:8px}input[type=checkbox]{width:20px;height:20px} @media(max-width:600px){.grid{grid-template-columns:1fr}body{padding:12px}}</style><h1>¿Cómo reparte tensión un divisor?</h1><p>Predice la salida y después cambia una resistencia. Entrada fija: 5 V.</p><div class="grid"><div class="box"><label for="r1">R₁ superior (kΩ)</label><input id="r1" type="range" min="1" max="10" step="1" value="5"><label for="r2">R₂ inferior (kΩ)</label><input id="r2" type="range" min="1" max="10" step="1" value="5"><button id="reset">Reiniciar</button><output id="read" aria-live="polite"></output></div><div class="box"><svg viewBox="0 0 320 330" role="img" aria-label="Divisor: resistencia superior e inferior, salida intermedia"><path d="M90 35 V70 M90 130 V195 M90 255 V300 M90 165 H205" stroke="#203944" stroke-width="4" fill="none"/><rect x="75" y="70" width="30" height="60" fill="white" stroke="#943d48" stroke-width="3"/><rect x="75" y="195" width="30" height="60" fill="white" stroke="#943d48" stroke-width="3"/><g font-family="sans-serif" font-size="20" fill="#203944"><text x="55" y="25">+5 V</text><text x="55" y="325">0 V</text><text id="a" x="125" y="106"></text><text id="b" x="125" y="232"></text><text id="v" x="180" y="153"></text></g><rect x="270" y="60" width="20" height="220" fill="#dcebe7"/><rect id="bar" x="270" y="170" width="20" height="110" fill="#943d48"/></svg></div></div><p class="small">Modelo: resistencias ideales y salida sin carga. El voltímetro ideal no toma corriente. Con una carga real hay que recalcular.</p><script>const $=id=>document.getElementById(id);function update(){const a=+$('r1').value,b=+$('r2').value,v=5*b/(a+b);$('read').textContent=`R₁ = ${a} kΩ; R₂ = ${b} kΩ. Salida: ${v.toFixed(2)} V. Corriente: ${(5/(a+b)).toFixed(2)} mA.`;$('a').textContent=a+' kΩ';$('b').textContent=b+' kΩ';$('v').textContent=v.toFixed(2)+' V';$('bar').setAttribute('y',280-44*v);$('bar').setAttribute('height',44*v)}document.querySelectorAll('input').forEach(x=>x.oninput=update);$('reset').onclick=()=>{$('r1').value=$('r2').value=5;update()};update();</script></html>
