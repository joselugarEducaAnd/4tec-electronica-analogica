<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>La salida cambia cuando conectas una carga</title><style>body{font:17px system-ui;color:#263c4a;margin:0;padding:20px;background:#fbf8f8}h1{font-size:23px;color:#943d48}label{display:inline-block;margin:8px 18px 8px 0}input,select,button{font:inherit;padding:8px;max-width:140px}svg{width:100%;height:auto}output{display:block;padding:14px;background:white;border:2px solid #943d48;border-radius:8px;line-height:1.5}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #176c9a}img{width:100%;max-height:260px;object-fit:contain}.note{font-size:15px}</style><h1>La salida cambia cuando conectas una carga</h1><p>Fuente de 5 V. R₁ arriba; R₂ entre S y 0 V. El voltímetro ideal mide S respecto de 0 V.</p><svg style="max-width:760px;display:block;margin:auto" viewBox="0 0 760 425" role="img" aria-labelledby="schematic-title"><title id="schematic-title">Divisor con valores elegidos y voltímetro entre S y 0 V</title><g fill="none" stroke="#263c4a" stroke-width="3"><path d="M80 160 V65 H250 V95 M80 260 V370 H650 V312 M250 185 V260 M250 350 V370 M250 230 H650 V268"/><circle cx="80" cy="210" r="50"/><rect x="238" y="95" width="24" height="90"/><rect x="238" y="260" width="24" height="90"/><circle cx="650" cy="290" r="22"/></g><g id="load-branch" fill="none" stroke="#263c4a" stroke-width="3"><path d="M450 230 V260 M450 350 V370"/><rect x="438" y="260" width="24" height="90"/></g><g font-family="system-ui" font-size="19" fill="#263c4a"><text x="80" y="193" text-anchor="middle">+</text><text x="80" y="241" text-anchor="middle">−</text><text x="30" y="310">5 V</text><text x="280" y="130">R₁</text><text x="280" y="161" id="r1-label"></text><text x="280" y="287">R₂</text><text x="280" y="320" id="r2-label"></text><text x="474" y="287">RL</text><text x="474" y="320" id="load-label"></text><text x="270" y="216">S</text><text x="270" y="403">0 V</text><text x="650" y="297" text-anchor="middle">V</text><text x="590" y="246" fill="#b93649">Roja</text><text x="590" y="348" fill="#176c9a">Negra</text><text x="515" y="80" id="voltage-label"></text></g><g fill="#943d48"><circle cx="250" cy="230" r="5"/><circle cx="250" cy="370" r="5"/></g></svg><label>R₁ (kΩ) <input id="r1" type="number" min="0.1" max="100" step="0.1" value="1"></label><label>R₂ (kΩ) <input id="r2" type="number" min="0.1" max="100" step="0.1" value="1"></label><label>Carga <select id="load"><option value="0">Sin carga</option><option value="1">RL = 1 kΩ</option><option value="2.2">RL = 2,2 kΩ</option><option value="10">RL = 10 kΩ</option></select></label><output id="out" aria-live="polite"></output><p>Predice antes de cambiar. Los valores del esquema siguen los controles; la rama RL desaparece al elegir Sin carga.</p><script>const f=n=>n.toFixed(3).replace('.',',');function calc(){let a=+r1.value,b=+r2.value,l=+load.value;if(!Number.isFinite(a)||!Number.isFinite(b)||a<.1||b<.1||a>100||b>100){document.querySelector('svg').style.visibility='hidden';out.textContent='Usa resistencias de 0,1 a 100 kΩ.';return}document.querySelector('svg').style.visibility='visible';let eq=l?b*l/(b+l):b,v=5*eq/(a+eq);document.getElementById('r1-label').textContent=f(a)+' kΩ';document.getElementById('r2-label').textContent=f(b)+' kΩ';document.getElementById('load-label').textContent=l?f(l)+' kΩ':'Sin carga';document.getElementById('load-branch').style.display=l?'':'none';document.getElementById('voltage-label').textContent='S: '+f(v)+' V';out.textContent=`R inferior equivalente = ${f(eq)} kΩ. Salida sin carga: ${f(5*b/(a+b))} V. Salida elegida: ${f(v)} V. Corriente por R₁: ${f((5-v)/a)} mA; por R₂: ${f(v/b)} mA; por carga: ${f(l?v/l:0)} mA.`}document.querySelectorAll('input,select').forEach(e=>e.oninput=calc);calc();</script></html>
